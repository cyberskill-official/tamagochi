# TASK-INFRA-002 scaffold placeholder.
# Colyseus realtime production deploy is not wired in this repository snapshot.
# Keep this file as a valid workflow so GitHub does not treat a stub as a broken run.
name: Realtime Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy environment
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

jobs:
  scaffold-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - run: npm ci

      - name: Verify repo contracts (no live Colyseus deploy secrets in CI)
        run: |
          npm run verify
          echo "Realtime deploy to '${{ inputs.environment }}' is not configured in this snapshot."
          echo "Server contracts remain covered by npm run verify / unit tests."
