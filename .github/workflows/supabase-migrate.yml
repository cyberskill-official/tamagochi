# TASK-INFRA scaffold placeholder.
# Live Supabase project deploy needs SUPABASE_* secrets + environment gates.
# Keep this as a valid workflow_dispatch-only gate so push never fails on stubs.
name: Supabase Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Supabase target to deploy
        required: true
        default: standard
        type: choice
        options:
          - standard
          - kids

jobs:
  scaffold-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - run: npm ci

      - name: Verify repo contracts (no live Supabase deploy secrets required)
        run: |
          npm run verify
          echo "Supabase deploy to '${{ inputs.target }}' is a production gate."
          echo "Secrets + environments must be configured before a real migrate."
