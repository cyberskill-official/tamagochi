name: Vercel Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      production:
        description: Deploy to production
        required: true
        default: false
        type: boolean

jobs:
  # Always verify + build static site on main. Vercel publish is optional —
  # missing VERCEL_* secrets must not red-X the branch.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - run: npm ci

      - run: npm run deploy:ready

  deploy:
    needs: build
    if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.production && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - run: npm ci

      - run: npm run deploy:ready

      - name: Pull Vercel project settings
        run: npx vercel@54.1.0 pull --yes --environment=${{ github.event_name == 'workflow_dispatch' && inputs.production && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build with Vercel
        run: npx vercel@54.1.0 build ${{ github.event_name == 'workflow_dispatch' && inputs.production && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt artifact
        run: npx vercel@54.1.0 deploy --prebuilt ${{ github.event_name == 'workflow_dispatch' && inputs.production && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
